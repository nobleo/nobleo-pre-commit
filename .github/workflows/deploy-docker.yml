name: Deploy Docker

on:
  workflow_dispatch:

jobs:
  deploy-docker:
    name: Deploy Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - run: |
          docker_tag="4"
          docker build . -t "nobleo/pre-commit:${docker_tag}"
          docker push "nobleo/pre-commit:${docker_tag}"

          docker build . --build-arg RUNNER="prek" -t "nobleo/prek:${docker_tag}"
          docker push "nobleo/prek:${docker_tag}"
